services:
  - type: web
    name: trading-journal
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: ENABLE_DEV_BILLING
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tradepath-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /data/uploads

databases:
  - name: tradepath-db
    postgresMajorVersion: "16"
