{% extends "base.html" %}

{% block content %}
<section class="form-panel auth-panel">
    <h2>Account</h2>
    <form action="/account" method="post" class="entry-form">
        <label>
            Name
            <input type="text" name="display_name" value="{{ user.display_name }}" required>
        </label>
        <label>
            Email
            <input type="email" value="{{ user.email }}" disabled>
        </label>
        {% if profile %}
        <label>
            Start balance
            <input type="number" step="0.01" name="starting_balance" value="{{ "%.2f"|format(profile.starting_balance or 0) }}" required>
        </label>
        {% endif %}
        <button type="submit">Save</button>
    </form>
    <p class="form-hint"><a class="text-link" href="/billing">Subscription</a></p>
</section>
{% endblock %}
