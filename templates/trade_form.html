{% extends "base.html" %}

{% block content %}
<section class="form-panel">
    <h2>Add Daily Trade Result</h2>
    <form action="/trades" method="post" enctype="multipart/form-data" class="entry-form">
        <label>
            Trade Date
            <input type="date" name="trade_date" value="{{ prefill_date }}" required>
        </label>
        <label>
            Pair
            <input type="text" name="pair" placeholder="BTCUSDT" required>
        </label>
        <label>
            Market Type
            <select name="market_type" required>
                <option value="Futures">Futures</option>
                <option value="Spot">Spot</option>
                <option value="Options">Options</option>
            </select>
        </label>
        <label>
            Session
            <input type="text" name="session" placeholder="London / New York / Asia" required>
        </label>
        <label>
            Daily PnL
            <input type="number" step="0.01" name="pnl_amount" placeholder="150.75 or -90.50" required>
        </label>
        <label>
            Outcome
            <select name="outcome" required>
                <option value="win">Win</option>
                <option value="loss">Loss</option>
                <option value="breakeven">Breakeven</option>
            </select>
        </label>
        <label>
            Notes
            <textarea name="notes" rows="5" placeholder="Why you won or lost, mistakes, emotions, execution notes"></textarea>
        </label>
        <label>
            Chart Screenshot (optional)
            <input type="file" name="chart_image" accept=".png,.jpg,.jpeg,.webp">
        </label>
        <button type="submit">Save Trade</button>
    </form>
</section>
{% endblock %}
