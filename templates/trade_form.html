{% extends "base.html" %}

{% block content %}
<section class="form-panel auth-panel">
    <h2>Add a trade</h2>
    <p class="form-hint">Profit is a plus number. Loss is a minus number. Then write the lesson.</p>
    <form action="/trades" method="post" enctype="multipart/form-data" class="entry-form">
        <label>
            Date
            <input type="date" name="trade_date" value="{{ prefill_date }}" required>
        </label>
        <label>
            Pair
            <input type="text" name="pair" placeholder="BTCUSDT" required>
        </label>
        <label>
            Result
            <select name="outcome" required>
                <option value="win">Win</option>
                <option value="loss">Loss</option>
            </select>
        </label>
        <label>
            Profit or loss ($)
            <input type="number" step="0.01" name="pnl_amount" placeholder="120 or -80" required>
        </label>
        <label class="span-full">
            Lesson
            <textarea name="notes" rows="5" placeholder="If you lost: what was the mistake? If you won: how did you gain?"></textarea>
        </label>
        <label>
            Chart (optional)
            <input type="file" name="chart_image" accept=".png,.jpg,.jpeg,.webp">
        </label>
        <button type="submit">Save trade</button>
    </form>
</section>
{% endblock %}
