{% extends "base.html" %}

{% block content %}
<section class="form-panel">
    <h2>Add a trade</h2>
    <p class="form-hint">Today {{ today_count }} / {{ max_trades }} trades. Stop when you hit the cap. Add the clock from open to close.</p>
    <form action="/trades" method="post" enctype="multipart/form-data" class="entry-form cal-form-grid">
        <label>
            Date
            <input type="date" name="trade_date" value="{{ prefill_date }}" required>
        </label>
        <label>
            Pair
            <select name="pair" required>
                {% for item in focus_pairs %}
                <option value="{{ item }}" {% if prefill_pair == item %}selected{% endif %}>
                    {% if item == 'XAUUSD' %}XAUUSD · Gold{% else %}BTCUSDT · Bitcoin{% endif %}
                </option>
                {% endfor %}
            </select>
        </label>
        <label>
            Session
            <select name="session">
                {% for item in focus_sessions %}
                <option value="{{ item }}" {% if loop.first %}selected{% endif %}>{{ item }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Opened at
            <input type="time" name="open_time">
        </label>
        <label>
            Closed at
            <input type="time" name="close_time">
        </label>
        <label>
            Result
            <select name="outcome" required>
                <option value="win">Win</option>
                <option value="loss">Loss</option>
            </select>
        </label>
        <label>
            Profit or loss ($)
            <input type="number" step="0.01" name="pnl_amount" placeholder="120 or -80" required>
        </label>
        {% include "_lesson_scenarios.html" %}
        <label class="span-full">
            Lesson
            <textarea name="notes" rows="6" placeholder="If you lost: what was the mistake? If you won: how did you gain?"></textarea>
        </label>
        <label>
            Chart (optional)
            <input type="file" name="chart_image" accept=".png,.jpg,.jpeg,.webp">
        </label>
        <button type="submit" class="span-full">Save trade</button>
    </form>
</section>
{% endblock %}
