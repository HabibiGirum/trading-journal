{% extends "base.html" %}

{% block content %}
<section class="form-panel auth-panel">
    <h2>Create account</h2>
    <p class="form-hint">Set your start balance. Then log trades and lessons.</p>
    <form action="/register" method="post" class="entry-form">
        <label>
            Name
            <input type="text" name="display_name" placeholder="Your name" required minlength="2">
        </label>
        <label>
            Email
            <input type="email" name="email" required autocomplete="email">
        </label>
        <label>
            Password
            <input type="password" name="password" required minlength="8" autocomplete="new-password">
        </label>
        <label>
            Start balance
            <input type="number" step="0.01" name="starting_balance" value="1000" required>
        </label>
        <button type="submit">Create account</button>
    </form>
    <p class="form-hint">Already have an account? <a class="text-link" href="/login">Sign in</a></p>
</section>
{% endblock %}
